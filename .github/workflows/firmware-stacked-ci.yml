name: Firmware Stacked PR CI

on:
  pull_request:
  push:
    branches:
      - main
      - ai-office/**
      - codex/**
      - ci/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-guards:
    name: Firmware host guards
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python compile checks
        run: |
          python3 -m py_compile \
            scripts/check_gosha_v1_pinmap.py \
            scripts/check_gosha_v1_gpio3_audio_contract.py \
            scripts/check_gosha_v1_no_motion_profile.py \
            scripts/check_voice_turn_phase_events.py \
            scripts/check_sensitive_logging.py \
            scripts/release.py \
            scripts/run_host_behavior_tests.py

      - name: Static firmware guards
        run: |
          python3 scripts/check_gosha_v1_pinmap.py --self-test
          python3 scripts/check_gosha_v1_gpio3_audio_contract.py --self-test
          python3 scripts/check_gosha_v1_no_motion_profile.py --self-test
          python3 scripts/check_voice_turn_phase_events.py --self-test
          python3 scripts/check_sensitive_logging.py
          python3 scripts/release.py --list-boards --json

      - name: Host behavioral tests
        run: python3 scripts/run_host_behavior_tests.py

      - name: Whitespace check
        working-directory: .
        run: git diff --check

  gosha-v1-example-build:
    name: Canonical gosha-v1 example build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build gosha-v1 with reserved endpoint
        env:
          GOSHA_OTA_URL: https://example.invalid/gosha-v1/ota
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/release.py gosha-v1 --name gosha-v1
          sha256sum build/gosha.bin > build/gosha.bin.sha256

      - name: Save example app for reproducible validation
        uses: actions/upload-artifact@v4
        with:
          name: gosha-v1-example-${{ github.sha }}
          path: |
            firmware/build/gosha.bin
            firmware/build/gosha.bin.sha256
          if-no-files-found: error
          retention-days: 14
